name: SonarCloud Analysis

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Push Empty Commit
        run: |
          git config --global user.name "Abdulrazak Othman"
          git config --global user.email "aa.othman01@gmail.com"
          git commit --allow-empty -m "chore: sonar scan completed [skip ci]"
          git push