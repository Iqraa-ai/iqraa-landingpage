#The name of the release
name: Release v1.0.14
#Declaring the branches and tags
on:
  push:
    branches:
      - "main"
#Declaring all jobs and flows
jobs:
  release:
    name: Release v1.0.14
    if: "github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[sonar]') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      #Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3

      #Create New Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.14
          release_name: Iqraa v1.0.14
          body: |
            Changes in this Release:
              - [New] Release new version v1.0.14
              - [New] Added SonarQube status to README file for visibility
          draft: false
          prerelease: false